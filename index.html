<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101B24">
<title>Truck Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--ink:#101B24;--paper:#EAEEF2;--card:#FFF;--line:#D8E0E7;--muted:#5B6B78;--text:#17232D;--amber:#F4A017;--amber2:#D8890B;--in:#0E9F6E;--out:#D6452F;--warn:#E07A00;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Space Grotesk','Noto Sans Bengali',system-ui,sans-serif;background:var(--paper);color:var(--text);-webkit-font-smoothing:antialiased;}
body.bn{font-family:'Noto Sans Bengali','Space Grotesk',system-ui,sans-serif;}
.mono{font-family:'Space Mono',monospace;}
.app{max-width:540px;margin:0 auto;min-height:100vh;padding:0 0 88px;}
.app.nonav{padding-bottom:28px;}
.screen{padding:16px;}
.sec-title{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:12px 2px 10px;}
.hint{font-size:12.5px;color:var(--muted);margin:-4px 2px 8px;line-height:1.4;}
/* header */
.hd{position:sticky;top:0;z-index:20;background:rgba(234,238,242,.94);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);}
.hd-brand{display:flex;align-items:center;gap:9px;min-width:0;}
.hd-logo{width:32px;height:32px;border-radius:9px;background:var(--amber);color:var(--ink);display:grid;place-items:center;box-shadow:0 2px 0 var(--amber2);flex-shrink:0;}
.hd-txt{display:flex;flex-direction:column;min-width:0;}
.hd-title{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hd-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hd-act{display:flex;gap:6px;flex-shrink:0;align-items:center;}
.iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--muted);display:grid;place-items:center;cursor:pointer;font-size:15px;}
.lang{border:1px solid var(--line);background:var(--card);border-radius:9px;height:36px;padding:0 11px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text);cursor:pointer;}
.pill{height:36px;display:inline-flex;align-items:center;padding:0 10px;border-radius:9px;background:#FEF3E2;color:#8A5A08;font-size:12.5px;font-weight:700;}
/* filters + segments */
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.sel{flex:1;min-width:120px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 32px 10px 11px;font-family:inherit;font-size:13.5px;color:var(--text);outline:none;-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%235B6B78' stroke-width='2.5'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 10px center;}
.seg{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px;}
.seg.dark{background:#0A1218;border-color:#263643;}
.seg-btn{border:0;background:transparent;color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:500;padding:6px 10px;border-radius:7px;cursor:pointer;white-space:nowrap;}
.seg-btn.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08);}
.seg.dark .seg-btn{color:#8095A3;} .seg.dark .seg-btn.on{background:var(--amber);color:#101B24;}
/* dashboard */
.hero{background:linear-gradient(165deg,#1B2A36 0%,#0D161D 100%);border-radius:18px;padding:18px;color:#E7EEF3;box-shadow:0 10px 30px -14px rgba(13,22,29,.55);border:1px solid #24333F;margin-bottom:14px;}
.hero-label{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#7E93A1;font-weight:500;margin-bottom:4px;}
.hero-net{font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:2px 0 14px;}
.hero-two{display:flex;background:#0B1319;border:1px solid #22313D;border-radius:11px;overflow:hidden;}
.hero-cell{flex:1;padding:11px 14px;display:flex;flex-direction:column;gap:3px;}
.hero-div{width:1px;background:#22313D;}
.hero-k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#6F8492;}
.hero-v{font-size:15px;font-weight:700;}
.target-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;}
.target-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.target-title{font-size:12px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;color:var(--muted);}
.target-bar-wrap{height:10px;background:var(--paper);border-radius:6px;overflow:hidden;margin-bottom:8px;}
.target-bar{height:100%;border-radius:6px;transition:width .3s ease;}
.target-sub{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;}
.card-k{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:5px;}
.card-v{font-size:18px;font-weight:700;} .card-v.sm{font-size:14.5px;}
.pos{color:var(--in);} .neg{color:var(--out);} .accent{color:var(--amber2);}
.chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;margin-top:12px;}
.bgrp{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;}
.bpair{display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center;}
.bar{width:12px;border-radius:3px 3px 0 0;min-height:2px;} .bar.i{background:var(--in);} .bar.e{background:var(--out);}
.blabel{font-size:10px;color:var(--muted);}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:6px;}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle;}
.brk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px;margin-bottom:14px;}
.brk-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);} .brk-row:first-child{border-top:0;}
.brk-name{font-size:13px;font-weight:500;flex-shrink:0;width:34%;}
.brk-bar-wrap{flex:1;height:8px;background:var(--paper);border-radius:5px;overflow:hidden;}
.brk-bar{height:100%;border-radius:5px;}
.brk-val{font-size:12.5px;font-weight:700;white-space:nowrap;}
/* alerts */
.alert-card{background:#FEF3E2;border:1px solid #FCD9A5;border-radius:14px;padding:12px 14px;margin-bottom:14px;}
.alert-card.danger{background:#FDECEA;border-color:#F8B4AB;}
.alert-card.ok{background:#E7F6EF;border-color:#A7E0C4;padding:10px 14px;}
.alert-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#8A5A08;margin-bottom:6px;}
.alert-card.danger .alert-head{color:var(--out);}
.alert-card.ok .alert-head{color:#0B7C54;margin:0;}
.alert-item{font-size:12.5px;color:#5A3F07;margin-top:4px;display:flex;justify-content:space-between;gap:8px;}
.alert-card.danger .alert-item{color:#6D1D13;}
/* lists */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.act{display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:13px;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;color:#fff;}
.act.in{background:var(--in);box-shadow:0 3px 0 #0B7C54;} .act.out{background:var(--out);box-shadow:0 3px 0 #A83421;}
.act.gen{grid-column:1/-1;background:#33414C;box-shadow:0 3px 0 #1B262E;}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.row{display:flex;align-items:center;gap:11px;padding:13px 14px;border-top:1px solid var(--line);cursor:pointer;} .row:first-child{border-top:0;} .row:active{background:#F6F8FA;}
.row-main{flex:1;min-width:0;}
.row-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.row-cat{font-weight:600;font-size:14px;}
.row-amt{font-weight:700;font-size:14.5px;white-space:nowrap;} .row-amt.income{color:var(--in);} .row-amt.expense{color:var(--out);}
.row-sub{display:flex;align-items:center;gap:6px;margin-top:3px;color:var(--muted);font-size:12px;flex-wrap:wrap;}
.badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;}
.badge.rcv{background:#FEF3E2;color:#8A5A08;} .badge.loan{background:#FDECEA;color:#A83421;} .badge.buy{background:#EAF1FD;color:#215BB8;}
.badge.fixed{background:#EDE9FE;color:#5B21B6;} .badge.warn{background:#FDECEA;color:#991B1B;}
.badge.auto{background:#E7F6EF;color:#0B7C54;} .badge.gen{background:#E9EDF1;color:#33414C;}
.tag{font-size:11px;color:var(--muted);background:var(--paper);padding:2px 7px;border-radius:6px;}
.st{font-size:11.5px;font-weight:600;} .st.wait{color:#8A5A08;} .st.ok{color:var(--in);}
.empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5;}
.due{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;}
.due-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.due-party{font-weight:600;font-size:15px;} .due-amt{font-weight:700;font-size:16px;}
.due-meta{color:var(--muted);font-size:12px;margin-top:4px;}
.due-btn{margin-top:11px;width:100%;border:0;border-radius:10px;padding:11px;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;color:#fff;}
.due-btn.rcv{background:var(--in);} .due-btn.pay{background:var(--out);}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:10px;cursor:pointer;}
.tcard-top{display:flex;justify-content:space-between;align-items:center;}
.tcard-name{font-weight:600;font-size:16px;}
.tcard-meta{color:var(--muted);font-size:12.5px;margin-top:5px;}
.tcard-docs{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;display:flex;flex-wrap:wrap;gap:6px;}
.doc-pill{padding:3px 8px;border-radius:6px;background:var(--paper);color:var(--muted);}
.doc-pill.soon{background:#FEF3E2;color:#92400E;font-weight:600;}
.doc-pill.over{background:#FDECEA;color:#991B1B;font-weight:600;}
.off{opacity:.55;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px;}
.tchip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 8px 7px 13px;font-size:13px;font-weight:500;}
.tchip.hid{opacity:.55;} .tchip span{cursor:pointer;}
.tchip button{width:20px;height:20px;border-radius:50%;border:0;background:var(--paper);color:var(--muted);display:grid;place-items:center;cursor:pointer;}
.addrow{display:flex;gap:8px;margin-top:8px;}
/* buttons */
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;color:#fff;background:var(--ink);text-align:center;text-decoration:none;}
.btn.in{background:var(--in);box-shadow:0 3px 0 #0B7C54;} .btn.out{background:var(--out);box-shadow:0 3px 0 #A83421;}
.btn.amber{background:var(--amber);color:var(--ink);box-shadow:0 3px 0 var(--amber2);}
.btn.ghost{background:var(--card);color:var(--text);border:1.5px solid var(--line);}
.btn.danger{background:var(--card);color:var(--out);border:1.5px solid #EDC6BF;}
.btn.xl{padding:18px;font-size:18px;margin-top:14px;}
.btn:active,.act:active{transform:translateY(1px);box-shadow:none;}
.btnsm{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 12px;font-family:inherit;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;}
/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom);}
.nav-in{max-width:540px;margin:0 auto;display:flex;}
.nav-item{flex:1;border:0;background:transparent;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#98A6B1;font-family:inherit;font-size:10.5px;font-weight:500;cursor:pointer;}
.nav-item.on{color:var(--amber2);}
/* modal + forms */
.overlay{position:fixed;inset:0;background:rgba(16,27,36,.55);display:none;align-items:flex-end;justify-content:center;z-index:50;}
.overlay.show{display:flex;}
.sheet{background:var(--card);width:100%;max-width:540px;border-radius:20px 20px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:94vh;overflow-y:auto;animation:up .22s ease;}
@media(min-width:580px){.overlay{align-items:center;}.sheet{border-radius:20px;}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
.sheet-head h3{font-size:19px;font-weight:600;display:flex;align-items:center;gap:8px;}
.label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em;}
.req{color:var(--out);}
.amtwrap{display:flex;align-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:6px 14px;}
.amtsym{font-family:'Space Mono',monospace;font-size:22px;font-weight:700;color:var(--muted);margin-right:8px;}
.amtin{flex:1;border:0;background:transparent;font-family:'Space Mono',monospace;font-size:28px;font-weight:700;color:var(--text);outline:none;width:100%;padding:6px 0;}
.amtwrap.big .amtin{font-size:38px;}
.input{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:11px;padding:12px 13px;font-family:inherit;font-size:15px;color:var(--text);outline:none;-webkit-appearance:none;}
.input:focus{border-color:var(--amber);}
select.input{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%235B6B78' stroke-width='2.5'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:36px;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.segfull{display:flex;background:var(--paper);border:1.5px solid var(--line);border-radius:11px;padding:3px;gap:3px;margin-top:6px;}
.segfull button{flex:1;border:0;background:transparent;color:var(--muted);font-family:inherit;font-size:13px;font-weight:600;padding:9px;border-radius:8px;cursor:pointer;}
.segfull button.on{background:var(--ink);color:#fff;}
.segfull.big button{padding:14px 8px;font-size:15px;}
.cond{display:none;} .cond.show{display:block;}
.check{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:500;cursor:pointer;}
.check input{width:20px;height:20px;accent-color:var(--in);flex-shrink:0;}
.dpwrap{border-radius:12px;padding:2px;transition:box-shadow .2s;}
.dpwrap.err{box-shadow:0 0 0 2.5px var(--out);}
/* login + driver */
.login{text-align:center;padding:44px 12px;}
.login-logo{width:76px;height:76px;margin:0 auto 16px;border-radius:20px;background:var(--amber);color:var(--ink);display:grid;place-items:center;box-shadow:0 4px 0 var(--amber2);}
.login h2{font-size:24px;margin-bottom:8px;}
.login-sub{color:var(--muted);font-size:15px;line-height:1.5;margin-bottom:24px;}
.gbtn{display:flex;justify-content:center;min-height:44px;}
.login-msg{margin-top:18px;background:#FDECEA;color:#A83421;padding:12px;border-radius:12px;font-size:14px;line-height:1.5;word-break:break-word;}
.notice{background:#EAF1FD;color:#215BB8;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45;margin-bottom:12px;}
.notice.warn{background:#FDECEA;color:#A83421;}
.dbig{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;border:0;border-radius:18px;padding:22px;background:var(--in);color:#fff;font-family:inherit;font-size:22px;font-weight:700;box-shadow:0 4px 0 #0B7C54;cursor:pointer;margin-bottom:18px;}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.dtile{display:flex;flex-direction:column;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:16px 6px 12px;font-family:inherit;color:var(--text);cursor:pointer;box-shadow:0 2px 0 var(--line);}
.dtile:active,.dbig:active{transform:translateY(2px);box-shadow:none;}
.dico{font-size:32px;line-height:1;display:inline-flex;} .dico.sm{font-size:20px;}
.dname{font-size:13.5px;font-weight:600;text-align:center;line-height:1.2;}
.ichip{border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:9px 14px;font-family:inherit;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;}
.ichip.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.photo-btn{display:flex;align-items:center;gap:10px;justify-content:center;border:1.5px dashed #B9C4CE;border-radius:12px;padding:12px;margin:12px 0;cursor:pointer;font-weight:600;color:var(--muted);}
.photo-btn.off{opacity:.45;pointer-events:none;}
.photo-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 8px;}
.photo-row .photo-btn{margin:0;}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.thumb{position:relative;width:66px;height:66px;border-radius:9px;overflow:hidden;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted);text-decoration:none;}
.thumb img{width:100%;height:100%;object-fit:cover;}
.thumb button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(16,27,36,.78);color:#fff;font-size:12px;cursor:pointer;display:grid;place-items:center;}
.done{text-align:center;padding:30px 0 20px;}
.done-mark{width:90px;height:90px;border-radius:50%;background:var(--in);color:#fff;font-size:52px;display:grid;place-items:center;margin:0 auto 14px;animation:pop .3s ease;}
.done-amt{font-size:28px;font-weight:700;} .done-amt.income{color:var(--in);} .done-amt.expense{color:var(--out);}
.done-txt{color:var(--muted);margin-top:4px;font-size:16px;}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:30px;font-size:14px;font-weight:500;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center;max-width:88%;}
.toast.show{opacity:1;}
@keyframes up{from{transform:translateY(12px);opacity:.4}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
*:focus-visible{outline:2.5px solid var(--amber);outline-offset:2px;}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="hd" id="hd"></div>
  <div id="screen" class="screen"><div class="empty">Loading…</div></div>
</div>
<div class="nav" id="navWrap" style="display:none"><div class="nav-in" id="nav"></div></div>
<div class="overlay" id="overlay" onclick="closeModal(event)"><div class="sheet" id="modalBody" onclick="event.stopPropagation()"></div></div>
<div class="toast" id="toast"></div>

<script>
// ================= 1. CONFIG =================
var CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbwjT0ewHHatQw-_0TY_BwP_eH5-uwg-PYUJq_oi35iJFPDmOTaoAYVxF4vm_T5lpBpO/exec',
  CLIENT_ID: '1004470384283-k5bvplihlnp5klfe1t4iprpiva5cknti.apps.googleusercontent.com'
};

// ================= 2. Text =================
var I18N = {
  en: {

var formKind = 'income', formCostType = 'op', formStatus = 'received', editingId = '', form = {};
var dp = { mode: 'day', date: '', from: '', to: '' };

// ================= 4. Helpers =================
function t(k) { return (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k; }
function esc(s) { return (s == null ? '' : s + '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function svg(inner, size, sw) { return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (sw || 2) + '" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>'; }
function readJSON(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function todayStr() { return ymd(new Date()); }
function dayOffset(n) { var d = new Date(); d.setDate(d.getDate() - n); return ymd(d); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function val(id) { var el = document.getElementById(id); return el ? el.value : ''; }
function sym() { return SYM[state.settings.currency] || state.settings.currency + ' '; }
function grpLoc() { return ['BDT','INR','PKR','LKR','NPR'].indexOf(state.settings.currency) >= 0 ? 'en-IN' : 'en-US'; }
function money(n) { return sym() + new Intl.NumberFormat(grpLoc(), { maximumFractionDigits: 2 }).format(Math.round((n || 0) * 100) / 100); }
function num(n) { return new Intl.NumberFormat(grpLoc(), { maximumFractionDigits: 0 }).format(n || 0); }
function round2(n) { return Math.round(n * 100) / 100; }
function catLabel(n) { return (lang === 'bn' && CAT_BN[n]) ? CAT_BN[n] : n; }
function icon(n) { return ICON[n] || '🧾'; }
function findTruck(id) { return state.trucks.find(function (x) { return x.id === id; }); }
function truckName(id) { if (id === GENERAL) return t('generalShort'); var tr = findTruck(id); return tr ? tr.name : '—'; }
function findType(id) { return state.types.find(function (x) { return x.id === id; }); }
function findEntry(id) { return state.ledger.find(function (x) { return x.id === id; }); }
function findIdx(id) { return state.ledger.findIndex(function (x) { return x.id === id; }); }
function typesFor(kind) { return state.types.filter(function (x) { return x.kind === kind; }); }
function userName(email) { var u = state.users.find(function (x) { return x.email === email; }); return u ? u.name : (email || '').split('@')[0]; }
function fmtDate(s) { if (!s) return ''; var a = s.split('-'); if (a.length < 3) return s; return parseInt(a[2], 10) + ' ' + MON[lang][parseInt(a[1], 10) - 1] + ' ' + a[0].slice(2); }
function endOf(e) { return e.endDate && e.endDate > e.date ? e.endDate : e.date; }
function fmtWhen(e) { var en = endOf(e); return en && en !== e.date ? fmtDate(e.date) + ' – ' + fmtDate(en) : fmtDate(e.date); }
function daysTxt(n) { return n === 1 ? t('dayOne') : t('dayCount').replace('{n}', n); }
function isBaki(e) { return e.status === 'receivable' || e.status === 'loan' || e.status === 'unpaid'; }
function dnum(s) { var a = String(s || '').split('-'); return a.length < 3 ? NaN : Date.UTC(+a[0], +a[1] - 1, +a[2]) / 864e5; }
function dstr(n) { var d = new Date(n * 864e5); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
function periodRange(p) {
  if (p === 'all') return null;
  var now = new Date();
  if (p === 'month') return { from: ymd(new Date(now.getFullYear(), now.getMonth(), 1)), to: ymd(new Date(now.getFullYear(), now.getMonth() + 1, 0)) };
  return { from: dayOffset(6), to: todayStr() };
}
// A multi-day entry is spread evenly over its days, so each period gets only its share.
function clip(e, r) {
  if (!r) return e;
  if (!e.date) return null;
  var s = e.date, en = endOf(e);
  if (en < r.from || s > r.to) return null;
  if (s >= r.from && en <= r.to) return e;
  var a = s > r.from ? s : r.from, b = en < r.to ? en : r.to;
  var w = (dnum(b) - dnum(a) + 1) / (dnum(en) - dnum(s) + 1);
  var c = Object.assign({}, e);
  c.amount = e.amount * w; c.interest = (e.interest || 0) * w; c.distance = (e.distance || 0) * w;
  return c;
}
function inRange(list, r) { return list.map(function (e) { return clip(e, r); }).filter(Boolean); }
function daysUntil(dStr) {
  if (!dStr) return null;
  var a = dStr.split('-'); if (a.length < 3) return null;
  var target = new Date(+a[0], +a[1] - 1, +a[2]);
  var now = new Date(); now.setHours(0, 0, 0, 0);
  return Math.round((target - now) / (1000 * 60 * 60 * 24));
}
function isEntryFixed(e) {
  if (e.costNature) return e.costNature === 'fixed';
  return e.type === 'Purchase' || e.type === 'Loan/EMI';
}
function photoIds(e) { return String((e && e.photo) || '').split(',').map(function (x) { return x.trim(); }).filter(function (x) { return x && x !== 'pending'; }); }
function payPct() { var p = state.settings.driverPayPct; return (p === undefined || p === null || p === '') ? 20 : Math.max(0, Math.min(100, Number(p) || 0)); }
function toggleCls(id, c, on) { var el = document.getElementById(id); if (el) el.classList.toggle(c, on); }
function toast(msg) { var el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove('show'); }, 2600); }

// ================= 5. Server Communication =================
function api(action, data, extra) {
  var body = { action: action, token: token, data: data || {} };
  if (extra) Object.keys(extra).forEach(function (k) { body[k] = extra[k]; });
  return fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify(body) })
    .then(function (r) { if (!r.ok) throw new Error('net'); return r.json(); });
}
function adminCall(action, data, confirmSaved) {
  api(action, data).then(function (res) {
    if (res.ok) { store('tt_boot', state); if (confirmSaved) toast(t('saved')); return; }
    if (res.error === 'auth') return needLogin();
    toast(t('notSaved') + ' (' + res.error + ')'); refresh(true);
  }).catch(function () { toast(t('notSaved') + ' — ' + t('offline')); refresh(true); });
}
function qid(q) { return q.op === 'save' ? q.entry.id : q.id; }
function isPending(id) { return queue.some(function (q) { return qid(q) === id; }); }
function lite(e) {
  var c = {};
  Object.keys(e).forEach(function (k) { if (k !== 'photoData' && k !== 'photosData') c[k] = e[k]; });
  if ((e.photoData || (e.photosData && e.photosData.length)) && !c.photo) c.photo = 'pending';
  return c;
}
function enqueue(item) {
  var key = qid(item);
  if (item.op === 'save') {
    var en = item.entry;
    if (en.photo === 'pending') en.photo = '';
    if (!en.photosData && !en.photoData) queue.forEach(function (q) {
      if (q.op === 'save' && q.entry.id === key) {
        if (q.entry.photosData) en.photosData = q.entry.photosData;
        if (q.entry.photoData) en.photoData = q.entry.photoData;
      }
    });
  }
  var next = queue.filter(function (q) { return qid(q) !== key; }).concat([item]);
  if (!store('tt_queue', next)) { toast(t('storageFull')); return false; }
  queue = next; updatePending(); flush(); return true;
}
function flush() {
  if (flushing || !queue.length || !token || navigator.onLine === false) return;
  flushing = true;
  var item = queue[0];
  (item.op === 'save' ? api('saveEntry', item.entry) : api('deleteEntry', { id: item.id })).then(function (res) {
    flushing = false;
    if (!res.ok && res.error === 'auth') return needLogin();
    if (!res.ok && PERMANENT.indexOf(res.error) < 0) return;
    queue = queue.filter(function (q) { return q !== item; });
    store('tt_queue', queue);
    if (!res.ok) { toast(t('notSaved') + ' (' + res.error + ')'); refresh(true); }
    else if (item.op === 'save' && !isPending(res.data.id)) { var i = findIdx(res.data.id); if (i >= 0) state.ledger[i] = res.data; }
    store('tt_boot', state); updatePending(); flush();
  }).catch(function () { flushing = false; });
}
function applyQueue() {
  queue.forEach(function (q) {
    if (q.op === 'delete') { state.ledger = state.ledger.filter(function (x) { return x.id !== q.id; }); return; }
    var e = lite(q.entry), i = findIdx(e.id);
    if (i >= 0) state.ledger[i] = e; else state.ledger.unshift(e);
  });
}
function updatePending() { if (state.me) softRender(); else renderHeader(); }

// ================= 6. Sign-in =================
function start() {
  applyLang();
  if (CONFIG.API_URL.indexOf('https://') !== 0 || CONFIG.CLIENT_ID.indexOf('PASTE') === 0) {
    renderHeader(); document.getElementById('screen').innerHTML = '<div class="empty">' + t('setupNeeded') + '</div>'; return;
  }
  if (!token) return showLogin();
  var cached = readJSON('tt_boot', null);
  if (cached && cached.me) onBoot(cached);
  refresh(!!cached);
}
function showLogin(msg) {
  state.me = null; renderHeader(); renderNav();
  if (!msg && navigator.onLine === false) msg = t('offline');
  document.getElementById('screen').innerHTML = '<div class="login"><div class="login-logo">' + svg(TRUCK, 40, 2.2) + '</div><h2>' + t('appName') + '</h2><p class="login-sub">' + t('signInHelp') + '</p><div id="gbtn" class="gbtn"></div>' + (msg ? '<p class="login-msg">' + esc(msg) + '</p>' : '') + '</div>';
  whenGIS(function () {
    var el = document.getElementById('gbtn'); if (!el) return;
    google.accounts.id.initialize({ client_id: CONFIG.CLIENT_ID, callback: onCredential });
    google.accounts.id.renderButton(el, { theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with', locale: lang, width: 260 });
  });
}
function whenGIS(cb) { if (window.google && google.accounts && google.accounts.id) cb(); else setTimeout(function () { whenGIS(cb); }, 300); }
function onCredential(resp) {
  document.getElementById('screen').innerHTML = '<div class="empty">' + t('loading') + '</div>';
  api('login', null, { credential: resp.credential }).then(function (res) {
    if (res.ok) { token = res.token; localStorage.setItem('tt_token', token); onBoot(res.data); }
    else if (res.error === 'notAllowed') showLogin(t('notAllowed').replace('{email}', res.email));
    else showLogin(t('loginFailed'));
  }).catch(function () { showLogin(t('loginFailed')); });
}
function needLogin() { token = ''; localStorage.removeItem('tt_token'); showLogin(t('signAgain')); }
function logout() {
  var out = function () {
    token = ''; queue = [];
    ['tt_token', 'tt_boot', 'tt_queue'].forEach(function (k) { localStorage.removeItem(k); });
    if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
    closeModal(); showLogin();
  };
  if (queue.length) showConfirm(t('confirmLogoutPending').replace('{n}', queue.length), out, t('logout')); else out();
}
function refresh(silent) {
  if (!token) return showLogin();
  return api('boot').then(function (res) {
    if (res.ok) return onBoot(res.data);
    if (res.error === 'auth') return needLogin();
    if (!silent) toast(t('notSaved') + ' (' + res.error + ')');
  }).catch(function () {
    if (!state.me) document.getElementById('screen').innerHTML = '<div class="empty">' + t('offline') + '<br><br><button class="btnsm" onclick="refresh()">↻ ' + t('retry') + '</button></div>';
    else if (!silent) toast(t('offline'));
  });
}
function onBoot(d) {
  var s = d.settings || {};
  d.users = d.users || [];
  d.settings = {
    currency: s.currency || 'BDT',
    language: s.language || 'bn',
    targetMonthlyProfit: Number(s.targetMonthlyProfit) || 0,
    driverPayPct: (s.driverPayPct === undefined || s.driverPayPct === null || s.driverPayPct === '') ? 20 : (Number(s.driverPayPct) || 0)
  };
  state = d;
  store('tt_boot', d);
  applyQueue(); applyLang(); softRender(); flush();
}

// ================= 7. Screens =================
function applyLang() { document.body.classList.toggle('bn', lang === 'bn'); document.documentElement.lang = lang; }
function setLang(l) { lang = l; localStorage.setItem('tt_lang', l); applyLang(); if (state.me) render(); else showLogin(); }

function go(s) { screen = s; render(); window.scrollTo(0, 0); }

  var a = document.activeElement;

  render();
}
function render() {
  renderHeader(); renderNav();

// ---------- shared: buttons, date picker, auto driver pay ----------
function tbtn(on, label, fn, id) { return '<button type="button"' + (id ? ' id="' + id + '"' : '') + ' class="' + (on ? 'on' : '') + '" onclick="' + fn + '">' + label + '</button>'; }
function datePicker() {

    + '<div><label class="label" style="margin-top:10px">' + t('toDate') + '</label><input class="input" id="dp_to" type="date" max="' + today + '" value="' + esc(dp.to) + '" onchange="dpChanged()"></div></div>'
    + '<p class="hint" id="dp_span" style="margin:8px 2px 0">' + spanText() + '</p></div></div>';

function keepDates() {
  var a = document.getElementById('dp_date'), b = document.getElementById('dp_from'), c = document.getElementById('dp_to');
  if (a) dp.date = a.value; if (b) dp.from = b.value; if (c) dp.to = c.value;
}
function setDateMode(m) {

  if (m === 'range' && !dp.from && dp.date) { dp.from = dp.date; var b = document.getElementById('dp_from'); if (b) b.value = dp.from; }
  toggleCls('dm_day', 'on', m === 'day'); toggleCls('dm_range', 'on', m === 'range');
  toggleCls('dp_day', 'show', m === 'day'); toggleCls('dp_range', 'show', m === 'range');

function quickDay(n) { var el = document.getElementById('dp_date'); if (el) el.value = dayOffset(n); dpChanged(); }
function dpChanged() {
  keepDates();
  toggleCls('dq0', 'on', dp.date === dayOffset(0)); toggleCls('dq1', 'on', dp.date === dayOffset(1));
  var s = document.getElementById('dp_span'); if (s) s.textContent = spanText();
  toggleCls('dpWrap', 'err', false);
}
function spanText() { return dp.from && dp.to && dp.to >= dp.from ? daysTxt(dnum(dp.to) - dnum(dp.from) + 1) : ''; }
function readDates() {
  keepDates();
  var today = todayStr(), res;
  if (dp.mode === 'range') {
    if (!dp.from || !dp.to) res = { err: t('pickRange') };
    else if (dp.to < dp.from) res = { err: t('badRange') };
    else if (dp.to > today) res = { err: t('noFuture') };
    else res = { date: dp.from, endDate: dp.to === dp.from ? '' : dp.to };
  } else {
    if (!dp.date) res = { err: t('pickDate') };

  }

  return res;
}
function driverOf(truckId) {

// Keeps the auto "Driver pay" cost in step with an income entry. Returns the pay entry (or null).

I18N.en.payAuto = 'Driver pay (auto {p}%, you can change it)';
I18N.bn.payAuto = 'চালকের বেতন (স্বয়ংক্রিয় {p}%, চাইলে বদলাতে পারেন)';
I18N.en.payHint = 'Fills in from the amount. Type another number to change it, or 0 for no driver pay.';
I18N.bn.payHint = 'পরিমাণ থেকে নিজে থেকেই বসে যায়। অন্য সংখ্যা লিখে বদলাতে পারেন, চালকের বেতন না থাকলে ০ লিখুন।';

function resetPay() { payManual = false; onAmtInput(); }
function readPay() { var p = document.getElementById('pay_amt'); return p ? Math.max(0, round2(parseFloat(p.value) || 0)) : null; }
// Keeps the linked "Driver pay" cost in step with an income. payAmount 0 = no driver pay. Returns the pay entry or null.
function syncAutoPay(inc, payAmount) {
  var cid = inc.id + '_dp', old = findEntry(cid);
  if (!(payAmount > 0) || inc.kind !== 'income') {
    if (old) { state.ledger = state.ledger.filter(function (x) { return x.id !== cid; }); enqueue({ op: 'delete', id: cid }); }
    return null;
  }
  var isAuto = payAmount === autoPayFor(inc.amount);
  var c = {
    id: cid, linkId: inc.id, truckId: inc.truckId, kind: 'expense', type: 'Driver pay', amount: round2(payAmount),
    date: inc.date, endDate: inc.endDate || '',
    note: isAuto ? payPct() + '% × ' + money(inc.amount) : t('income') + ' ' + money(inc.amount),
    status: old ? old.status : 'paid', party: old && old.party ? old.party : driverOf(inc.truckId),
    dueDate: old ? (old.dueDate || '') : '', interest: old ? (old.interest || 0) : 0, distance: 0,
    createdAt: old ? old.createdAt : (inc.createdAt || Date.now()), enteredBy: inc.enteredBy || state.me.email,
    photo: '', costNature: 'op', payer: old ? (old.payer || '') : ''
  };
  if (!enqueue({ op: 'save', entry: c })) return null;
  var i = findIdx(cid); if (i >= 0) state.ledger[i] = c; else state.ledger.unshift(c);
  return c;
}

// ---------- DRIVER ----------
function viewDriver() {
  var h = '';

  h += '<div class="two"><div><label class="label">' + t('role') + '</label><select class="input" id="u_role"><option value="driver"' + (role === 'driver' ? ' selected' : '') + '>' + t('driver') + '</option><option value="admin"' + (role === 'admin' ? ' selected' : '') + '>' + t('admin') + '</option></select></div>'
    + '<div><label class="label">' + t('truck') + '</label><select class="input" id="u_truck"><option value="">' + t('none') + '</option>' + state.trucks.map(function (x) { return '<option value="' + x.id + '"' + (tr === x.id ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('') + '</select></div></div>';
  h += '<label class="check" style="margin-top:14px"><input type="checkbox" id="u_active"' + (!u || u.active ? ' checked' : '') + '> ' + t('active') + '</label>';
  h += '<button class="btn amber" style="margin-top:16px" onclick="saveUserForm()">' + t('save') + '</button>';
  if (u && u.email !== state.me.email) h += '<button class="btn danger" style="margin-top:10px" onclick="deleteUserConfirm(' + i + ')">' + t('del') + '</button>';
  openModal(h);
}
function saveUserForm() {
  var u = { email: val('u_email').trim().toLowerCase(), name: val('u_name').trim(), role: val('u_role'), truckId: val('u_truck'), active: document.getElementById('u_active').checked };
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(u.email)) return toast(t('email') + '?');
  if (u.email === state.me.email && (u.role !== 'admin' || !u.active)) return toast(t('notSaved'));
  if (!u.name) u.name = u.email.split('@')[0];
  var i = state.users.findIndex(function (x) { return x.email === u.email; });
  if (i >= 0) state.users[i] = u; else state.users.push(u);
  closeModal(); render(); toast(t('saved')); adminCall('saveUser', u);
}
function deleteUserConfirm(i) { var u = state.users[i]; if (!u) return; showConfirm(t('del') + ': ' + u.name + '?', function () { state.users.splice(i, 1); closeModal(); render(); adminCall('deleteUser', { email: u.email }); }); }

// ---------- modal plumbing ----------
function showConfirm(msg, onYes, yesLabel) {
  window.__yes = onYes;
  openModal('<div class="sheet-head"><h3>' + esc(msg) + '</h3></div><button class="btn danger" onclick="__yes()">' + (yesLabel || t('del')) + '</button><button class="btn ghost" style="margin-top:10px" onclick="closeModal()">' + t('cancel') + '</button>');
}
function openModal(html) { document.getElementById('modalBody').innerHTML = html; document.getElementById('overlay').classList.add('show'); }
function closeModal(ev) { if (ev && ev.target && ev.target.id !== 'overlay') return; document.getElementById('overlay').classList.remove('show'); }

// ================= 8. Go =================
if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
window.addEventListener('online', flush);
document.addEventListener('visibilitychange', function () { if (!document.hidden && token) { flush(); refresh(true); } });
setInterval(flush, 30000);
start();
</script>
