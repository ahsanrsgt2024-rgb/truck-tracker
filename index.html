<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101B24">
<title>Truck Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--ink:#101B24;--paper:#EAEEF2;--card:#FFF;--line:#D8E0E7;--muted:#5B6B78;--text:#17232D;--amber:#F4A017;--amber2:#D8890B;--in:#0E9F6E;--out:#D6452F;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Space Grotesk','Noto Sans Bengali',system-ui,sans-serif;background:var(--paper);color:var(--text);-webkit-font-smoothing:antialiased;}
body.bn{font-family:'Noto Sans Bengali','Space Grotesk',system-ui,sans-serif;}
.mono{font-family:'Space Mono',monospace;}
.app{max-width:540px;margin:0 auto;min-height:100vh;padding:0 0 88px;}
.app.nonav{padding-bottom:28px;}
.screen{padding:16px;}
.sec-title{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:4px 2px 10px;}
.hint{font-size:12.5px;color:var(--muted);margin:-4px 2px 8px;line-height:1.4;}
/* header */
.hd{position:sticky;top:0;z-index:20;background:rgba(234,238,242,.94);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);}
.hd-brand{display:flex;align-items:center;gap:9px;min-width:0;}
.hd-logo{width:32px;height:32px;border-radius:9px;background:var(--amber);color:var(--ink);display:grid;place-items:center;box-shadow:0 2px 0 var(--amber2);flex-shrink:0;}
.hd-txt{display:flex;flex-direction:column;min-width:0;}
.hd-title{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hd-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hd-act{display:flex;gap:6px;flex-shrink:0;align-items:center;}
.iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--muted);display:grid;place-items:center;cursor:pointer;font-size:15px;}
.lang{border:1px solid var(--line);background:var(--card);border-radius:9px;height:36px;padding:0 11px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text);cursor:pointer;}
.pill{height:36px;display:inline-flex;align-items:center;padding:0 10px;border-radius:9px;background:#FEF3E2;color:#8A5A08;font-size:12.5px;font-weight:700;}
/* filters + segments */
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.sel{flex:1;min-width:120px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 32px 10px 11px;font-family:inherit;font-size:13.5px;color:var(--text);outline:none;-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%235B6B78' stroke-width='2.5'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 10px center;}
.seg{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px;}
.seg.dark{background:#0A1218;border-color:#263643;}
.seg-btn{border:0;background:transparent;color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:7px;cursor:pointer;white-space:nowrap;}
.seg-btn.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08);}
.seg.dark .seg-btn{color:#8095A3;} .seg.dark .seg-btn.on{background:var(--amber);color:#101B24;}
/* dashboard */
.hero{background:linear-gradient(165deg,#1B2A36 0%,#0D161D 100%);border-radius:18px;padding:18px;color:#E7EEF3;box-shadow:0 10px 30px -14px rgba(13,22,29,.55);border:1px solid #24333F;margin-bottom:14px;}
.hero-label{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#7E93A1;font-weight:500;margin-bottom:4px;}
.hero-net{font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:2px 0 14px;}
.hero-two{display:flex;background:#0B1319;border:1px solid #22313D;border-radius:11px;overflow:hidden;}
.hero-cell{flex:1;padding:11px 14px;display:flex;flex-direction:column;gap:3px;}
.hero-div{width:1px;background:#22313D;}
.hero-k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#6F8492;}
.hero-v{font-size:16px;font-weight:700;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;}
.card-k{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:5px;}
.card-v{font-size:19px;font-weight:700;} .card-v.sm{font-size:15px;}
.pos{color:var(--in);} .neg{color:var(--out);} .accent{color:var(--amber2);}
.chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;margin-top:12px;}
.bgrp{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;}
.bpair{display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center;}
.bar{width:12px;border-radius:3px 3px 0 0;min-height:2px;} .bar.i{background:var(--in);} .bar.e{background:var(--out);}
.blabel{font-size:10px;color:var(--muted);}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:4px;}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle;}
.brk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px;margin-bottom:14px;}
.brk-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);} .brk-row:first-child{border-top:0;}
.brk-name{font-size:13.5px;font-weight:500;flex-shrink:0;width:34%;}
.brk-bar-wrap{flex:1;height:8px;background:var(--paper);border-radius:5px;overflow:hidden;}
.brk-bar{height:100%;border-radius:5px;}
.brk-val{font-size:13px;font-weight:700;white-space:nowrap;}
/* lists */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.act{display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:13px;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;color:#fff;}
.act.in{background:var(--in);box-shadow:0 3px 0 #0B7C54;} .act.out{background:var(--out);box-shadow:0 3px 0 #A83421;}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.row{display:flex;align-items:center;gap:11px;padding:13px 14px;border-top:1px solid var(--line);cursor:pointer;} .row:first-child{border-top:0;} .row:active{background:#F6F8FA;}
.row-main{flex:1;min-width:0;}
.row-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.row-cat{font-weight:600;font-size:14.5px;}
.row-amt{font-weight:700;font-size:14.5px;white-space:nowrap;} .row-amt.income{color:var(--in);} .row-amt.expense{color:var(--out);}
.row-sub{display:flex;align-items:center;gap:6px;margin-top:3px;color:var(--muted);font-size:12px;flex-wrap:wrap;}
.badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;}
.badge.rcv{background:#FEF3E2;color:#8A5A08;} .badge.loan{background:#FDECEA;color:#A83421;} .badge.buy{background:#EAF1FD;color:#215BB8;}
.tag{font-size:11px;color:var(--muted);background:var(--paper);padding:2px 7px;border-radius:6px;}
.st{font-size:11.5px;font-weight:600;} .st.wait{color:#8A5A08;} .st.ok{color:var(--in);}
.empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5;}
.due{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;}
.due-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.due-party{font-weight:600;font-size:15px;} .due-amt{font-weight:700;font-size:16px;}
.due-meta{color:var(--muted);font-size:12.5px;margin-top:4px;}
.due-btn{margin-top:11px;width:100%;border:0;border-radius:10px;padding:11px;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;color:#fff;}
.due-btn.rcv{background:var(--in);} .due-btn.pay{background:var(--out);}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:10px;cursor:pointer;}
.tcard-top{display:flex;justify-content:space-between;align-items:center;}
.tcard-name{font-weight:600;font-size:16px;}
.tcard-meta{color:var(--muted);font-size:12.5px;margin-top:5px;}
.off{opacity:.55;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px;}
.tchip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 8px 7px 13px;font-size:13px;font-weight:500;}
.tchip.hid{opacity:.55;} .tchip span{cursor:pointer;}
.tchip button{width:20px;height:20px;border-radius:50%;border:0;background:var(--paper);color:var(--muted);display:grid;place-items:center;cursor:pointer;}
.addrow{display:flex;gap:8px;margin-top:8px;}
/* buttons */
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;color:#fff;background:var(--ink);text-align:center;text-decoration:none;}
.btn.in{background:var(--in);box-shadow:0 3px 0 #0B7C54;} .btn.out{background:var(--out);box-shadow:0 3px 0 #A83421;}
.btn.amber{background:var(--amber);color:var(--ink);box-shadow:0 3px 0 var(--amber2);}
.btn.ghost{background:var(--card);color:var(--text);border:1.5px solid var(--line);}
.btn.danger{background:var(--card);color:var(--out);border:1.5px solid #EDC6BF;}
.btn.xl{padding:18px;font-size:18px;margin-top:14px;}
.btn:active,.act:active{transform:translateY(1px);box-shadow:none;}
.btnsm{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 12px;font-family:inherit;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;}
/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom);}
.nav-in{max-width:540px;margin:0 auto;display:flex;}
.nav-item{flex:1;border:0;background:transparent;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#98A6B1;font-family:inherit;font-size:10.5px;font-weight:500;cursor:pointer;}
.nav-item.on{color:var(--amber2);}
/* modal + forms */
.overlay{position:fixed;inset:0;background:rgba(16,27,36,.55);display:none;align-items:flex-end;justify-content:center;z-index:50;}
.overlay.show{display:flex;}
.sheet{background:var(--card);width:100%;max-width:540px;border-radius:20px 20px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:94vh;overflow-y:auto;animation:up .22s ease;}
@media(min-width:580px){.overlay{align-items:center;}.sheet{border-radius:20px;}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
.sheet-head h3{font-size:19px;font-weight:600;display:flex;align-items:center;gap:8px;}
.label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;}
.amtwrap{display:flex;align-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:6px 14px;}
.amtsym{font-family:'Space Mono',monospace;font-size:22px;font-weight:700;color:var(--muted);margin-right:8px;}
.amtin{flex:1;border:0;background:transparent;font-family:'Space Mono',monospace;font-size:28px;font-weight:700;color:var(--text);outline:none;width:100%;padding:6px 0;}
.amtwrap.big .amtin{font-size:38px;}
.input{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:11px;padding:12px 13px;font-family:inherit;font-size:15px;color:var(--text);outline:none;-webkit-appearance:none;}
.input:focus{border-color:var(--amber);}
select.input{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%235B6B78' stroke-width='2.5'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:36px;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.segfull{display:flex;background:var(--paper);border:1.5px solid var(--line);border-radius:11px;padding:3px;gap:3px;margin-top:12px;}
.segfull button{flex:1;border:0;background:transparent;color:var(--muted);font-family:inherit;font-size:13.5px;font-weight:600;padding:10px;border-radius:8px;cursor:pointer;}
.segfull button.on{background:var(--ink);color:#fff;}
.segfull.big button{padding:15px 8px;font-size:16px;}
.cond{display:none;} .cond.show{display:block;}
.check{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:500;cursor:pointer;}
.check input{width:20px;height:20px;accent-color:var(--in);}
/* login + driver */
.login{text-align:center;padding:44px 12px;}
.login-logo{width:76px;height:76px;margin:0 auto 16px;border-radius:20px;background:var(--amber);color:var(--ink);display:grid;place-items:center;box-shadow:0 4px 0 var(--amber2);}
.login h2{font-size:24px;margin-bottom:8px;}
.login-sub{color:var(--muted);font-size:15px;line-height:1.5;margin-bottom:24px;}
.gbtn{display:flex;justify-content:center;min-height:44px;}
.login-msg{margin-top:18px;background:#FDECEA;color:#A83421;padding:12px;border-radius:12px;font-size:14px;line-height:1.5;word-break:break-word;}
.notice{background:#EAF1FD;color:#215BB8;border-radius:12px;padding:12px 14px;font-size:14.5px;line-height:1.45;margin-bottom:12px;}
.notice.warn{background:#FDECEA;color:#A83421;}
.dbig{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;border:0;border-radius:18px;padding:22px;background:var(--in);color:#fff;font-family:inherit;font-size:22px;font-weight:700;box-shadow:0 4px 0 #0B7C54;cursor:pointer;margin-bottom:18px;}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.dtile{display:flex;flex-direction:column;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:16px 6px 12px;font-family:inherit;color:var(--text);cursor:pointer;box-shadow:0 2px 0 var(--line);}
.dtile:active,.dbig:active{transform:translateY(2px);box-shadow:none;}
.dico{font-size:34px;line-height:1;display:inline-flex;} .dico.sm{font-size:22px;}
.dname{font-size:14px;font-weight:600;text-align:center;line-height:1.2;}
.ichip{border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:9px 14px;font-family:inherit;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;}
.ichip.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.photo-btn{display:flex;align-items:center;gap:10px;justify-content:center;border:1.5px dashed #B9C4CE;border-radius:12px;padding:12px;margin:12px 0;cursor:pointer;font-weight:600;color:var(--muted);}
.photo-btn img{width:56px;height:56px;object-fit:cover;border-radius:8px;}
.done{text-align:center;padding:30px 0 20px;}
.done-mark{width:90px;height:90px;border-radius:50%;background:var(--in);color:#fff;font-size:52px;display:grid;place-items:center;margin:0 auto 14px;animation:pop .3s ease;}
.done-amt{font-size:28px;font-weight:700;} .done-amt.income{color:var(--in);} .done-amt.expense{color:var(--out);}
.done-txt{color:var(--muted);margin-top:4px;font-size:16px;}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:30px;font-size:14px;font-weight:500;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center;max-width:88%;}
.toast.show{opacity:1;}
@keyframes up{from{transform:translateY(12px);opacity:.4}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
*:focus-visible{outline:2.5px solid var(--amber);outline-offset:2px;}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>

    queue = queue.filter(function (q) { return q !== item; });

  state = d;
  store('tt_boot', d);
  applyQueue(); applyLang(); softRender(); flush();
}

// ================= 7. Screens =================
function applyLang() { document.body.classList.toggle('bn', lang === 'bn'); document.documentElement.lang = lang; }
function setLang(l) { lang = l; localStorage.setItem('tt_lang', l); applyLang(); if (state.me) render(); else showLogin(); }
function toggleLang() { setLang(lang === 'bn' ? 'en' : 'bn'); }
function go(s) { screen = s; render(); window.scrollTo(0, 0); }
function softRender() {
  var a = document.activeElement;
  if (a && /INPUT|SELECT|TEXTAREA/.test(a.tagName) && document.getElementById('screen').contains(a)) return renderHeader();
  render();
}
function render() {
  renderHeader(); renderNav();
  if (!state.me) return;
  var el = document.getElementById('screen');
  if (state.me.role !== 'admin') { el.innerHTML = viewDriver(); return; }
  el.innerHTML = screen === 'ledger' ? viewLedger() : screen === 'trucks' ? viewTrucks() : screen === 'dues' ? viewDues() : screen === 'settings' ? viewSettings() : viewDashboard();
}
function renderHeader() {
  var me = state.me, sub = '';
  if (me && me.role !== 'admin') sub = esc(me.name) + (state.trucks[0] ? ' · ' + esc(state.trucks[0].name) : '');
  document.getElementById('hd').innerHTML =
    '<div class="hd-brand"><span class="hd-logo">' + svg(TRUCK, 18, 2.2) + '</span><div class="hd-txt"><span class="hd-title">' + t('appName') + '</span>' + (sub ? '<span class="hd-sub">' + sub + '</span>' : '') + '</div></div>'
    + '<div class="hd-act">' + (queue.length ? '<span class="pill" title="' + t('pending') + '">⏳ ' + queue.length + '</span>' : '')
    + '<button class="lang" onclick="toggleLang()">' + (lang === 'bn' ? 'EN' : 'বাংলা') + '</button>'
    + (me ? '<button class="iconbtn" onclick="refresh()" aria-label="Refresh">' + svg(REFRESH, 17) + '</button>' : '') + '</div>';
}
function renderNav() {
  var admin = !!(state.me && state.me.role === 'admin');
  document.getElementById('navWrap').style.display = admin ? '' : 'none';
  document.getElementById('app').classList.toggle('nonav', !admin);
  if (!admin) return;
  document.getElementById('nav').innerHTML = NAV.map(function (n) {
    return '<button class="nav-item' + (screen === n[0] ? ' on' : '') + '" onclick="go(\'' + n[0] + '\')">' + svg(n[1], 21) + '<span>' + t(n[0]) + '</span></button>';
  }).join('');
}

// ---------- DRIVER ----------
function viewDriver() {
  var h = '';
  if (!state.me.truckId || !state.trucks.length) h += '<div class="notice warn">' + t('askTruck') + '</div>';
  if (queue.length) h += '<div class="notice">⏳ ' + t('pendingNote').replace('{n}', queue.length) + '</div>';
  if (typesFor('income').length) h += '<button class="dbig" onclick="openDriverEntry(\'income\')"><span class="dico">💵</span><span>' + t('moneyIn') + '</span></button>';
  h += '<div class="sec-title">' + t('costs') + '</div><div class="dgrid">' + typesFor('expense').map(function (ty) {
    return '<button class="dtile" onclick="openDriverEntry(\'expense\',\'' + ty.id + '\')"><span class="dico">' + icon(ty.name) + '</span><span class="dname">' + esc(catLabel(ty.name)) + '</span></button>';
  }).join('') + '</div>';
  var mine = state.ledger.slice().sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
  h += '<div class="sec-title" style="margin-top:20px">' + t('recent') + '</div>';
  h += mine.length ? '<div class="list">' + mine.map(driverRow).join('') + '</div>' : '<div class="empty">' + t('noEntries') + '</div>';
  h += '<button class="btn ghost" style="margin-top:24px" onclick="logout()">' + t('logout') + '</button>';
  return h;
}
function driverRow(e) {
  var pend = isPending(e.id);
  return '<div class="row" onclick="driverRowTap(\'' + e.id + '\')"><span class="dico sm">' + icon(e.type) + '</span><div class="row-main"><div class="row-top"><span class="row-cat">' + esc(catLabel(e.type)) + '</span><span class="row-amt ' + e.kind + '">' + (e.kind === 'income' ? '+' : '−') + money(e.amount) + '</span></div>'
    + '<div class="row-sub"><span class="mono">' + fmtDate(e.date) + '</span>' + (isBaki(e) ? '<span class="badge rcv">' + t('baki') + '</span>' : '') + (e.photo ? '<span>📷</span>' : '')
    + '<span class="st ' + (pend ? 'wait">⏳ ' + t('pending') : 'ok">✓ ' + t('sent')) + '</span></div></div></div>';
}
function driverRowTap(id) {
  var e = findEntry(id); if (!e) return;
  if (Date.now() - (e.createdAt || 0) > 24 * 36e5) return toast(t('cantDelete'));
  deleteEntryConfirm(id);
}
function openDriverEntry(kind, typeId) {
  if (!state.me.truckId || !state.trucks.length) return toast(t('askTruck'));
  var ty = typeId ? findType(typeId) : typesFor(kind)[0];
  form = { kind: kind, type: ty ? ty.name : 'Other', baki: false, day: 0, photo: '', amount: '', party: '', note: '' };
  drawDriverForm();
  var a = document.getElementById('d_amount'); if (a) a.focus();
}
function tbtn(on, label, fn) { return '<button class="' + (on ? 'on' : '') + '" onclick="' + fn + '">' + label + '</button>'; }
function drawDriverForm() {
  var inc = form.kind === 'income', its = typesFor('income');
  var h = '<div class="sheet-head"><h3><span class="dico sm">' + (inc ? '💵' : icon(form.type)) + '</span>' + esc(inc ? t('moneyIn') : catLabel(form.type)) + '</h3><button class="iconbtn" onclick="closeModal()">✕</button></div>';
  if (inc && its.length > 1) h += '<div class="chips" style="margin-bottom:12px">' + its.map(function (ty) { return '<button class="ichip' + (form.type === ty.name ? ' on' : '') + '" onclick="setFormType(\'' + ty.id + '\')">' + icon(ty.name) + ' ' + esc(catLabel(ty.name)) + '</button>'; }).join('') + '</div>';
  h += '<div class="amtwrap big"><span class="amtsym">' + sym() + '</span><input class="amtin" id="d_amount" type="number" inputmode="decimal" placeholder="0" value="' + esc(form.amount) + '"></div>';
  h += '<div class="segfull big">' + tbtn(!form.baki, inc ? t('gotNow') : t('paidNow'), 'setBaki(false)') + tbtn(form.baki, inc ? t('willGet') : t('baki'), 'setBaki(true)') + '</div>';
  if (form.baki) h += '<input class="input" id="d_party" style="margin-top:10px" placeholder="' + t('whoName') + '" value="' + esc(form.party) + '">';
  h += '<div class="segfull">' + tbtn(form.day === 0, t('today'), 'setDay(0)') + tbtn(form.day === 1, t('yesterday'), 'setDay(1)') + '</div>';
  h += '<label class="photo-btn">' + (form.photo ? '<img src="' + form.photo + '" alt=""><span>' + t('retake') + '</span>' : '<span class="dico sm">📷</span><span>' + t('photo') + ' (' + t('optional') + ')</span>') + '<input type="file" accept="image/*" capture="environment" onchange="takePhoto(this)" hidden></label>';
  h += '<input class="input" id="d_note" placeholder="' + t('note') + ' (' + t('optional') + ')" value="' + esc(form.note) + '">';
  h += '<button class="btn xl ' + (inc ? 'in' : 'out') + '" onclick="saveDriverEntry()">✓ ' + t('save') + '</button>';
  openModal(h);
}
function keepInputs() { ['amount', 'party', 'note'].forEach(function (k) { var el = document.getElementById('d_' + k); if (el) form[k] = el.value; }); }
function setBaki(b) { keepInputs(); form.baki = b; drawDriverForm(); }
function setDay(n) { keepInputs(); form.day = n; drawDriverForm(); }
function setFormType(id) { keepInputs(); var ty = findType(id); if (ty) form.type = ty.name; drawDriverForm(); }
function takePhoto(input) {
  var f = input.files && input.files[0]; if (!f) return;
  keepInputs();
  var img = new Image(), url = URL.createObjectURL(f);
  img.onload = function () {
    var s = Math.min(1, 1100 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    form.photo = c.toDataURL('image/jpeg', 0.6); URL.revokeObjectURL(url); drawDriverForm();
  };
  img.src = url;
}
function saveDriverEntry() {
  keepInputs();
  var amount = parseFloat(form.amount);
  if (!amount || amount <= 0) { toast(t('amount') + '?'); var a = document.getElementById('d_amount'); if (a) a.focus(); return; }
  var d = new Date(); d.setDate(d.getDate() - form.day);
  var inc = form.kind === 'income';
  var e = { id: uid(), truckId: state.me.truckId, kind: form.kind, type: form.type, amount: Math.round(amount * 100) / 100, date: ymd(d), note: form.note.trim(),
    status: form.baki ? (inc ? 'receivable' : 'loan') : (inc ? 'received' : 'paid'), party: form.baki ? form.party.trim() : '', dueDate: '', interest: 0, distance: 0,
    createdAt: Date.now(), enteredBy: state.me.email, photo: '' };
  if (form.photo) e.photoData = form.photo;
  if (!enqueue({ op: 'save', entry: e })) return;
  state.ledger.unshift(lite(e)); render();
  openModal('<div class="done"><div class="done-mark">✓</div><div class="done-amt ' + e.kind + '">' + money(e.amount) + '</div><div class="done-txt">' + t('saved') + '</div></div>');
  setTimeout(function () { if (document.querySelector('#modalBody .done')) closeModal(); }, 1400);
}

// ---------- ADMIN: dashboard ----------
function sum(list, f) { return list.reduce(function (s, e) { return s + f(e); }, 0); }
function amt(e) { return e.amount; }
function aggByType(list) { var m = {}; list.forEach(function (e) { m[e.type] = (m[e.type] || 0) + e.amount; }); return m; }
function topKey(m) { return Object.keys(m).sort(function (a, b) { return m[b] - m[a]; })[0]; }
function truckSelect(cur, onchange) { return '<select class="sel" onchange="' + onchange + '"><option value="all">' + t('allTrucks') + '</option>' + state.trucks.map(function (tr) { return '<option value="' + tr.id + '"' + (cur === tr.id ? ' selected' : '') + '>' + esc(tr.name) + '</option>'; }).join('') + '</select>'; }
function seg(opts, cur, fn) { return opts.map(function (o) { var l = o === 'week' ? t('week') : o === 'month' ? t('month') : t('allTime'); return '<button class="seg-btn' + (cur === o ? ' on' : '') + '" onclick="' + fn + '(\'' + o + '\')">' + l + '</button>'; }).join(''); }
function setDashPeriod(v) { dashPeriod = v; render(); }
function card(k, v, cls, sm, sub) { return '<div class="card"><div class="card-k">' + k + '</div><div class="card-v ' + (sm ? 'sm ' : '') + (cls || '') + '">' + v + '</div>' + (sub ? '<div class="card-k" style="margin-top:4px">' + sub + '</div>' : '') + '</div>'; }
function viewDashboard() {
  var base = state.ledger.filter(function (e) { return dashTruck === 'all' || e.truckId === dashTruck; });
  var scoped = base.filter(function (e) { return inPeriod(e, dashPeriod); });
  var inc = scoped.filter(function (e) { return e.kind === 'income'; }), exp = scoped.filter(function (e) { return e.kind === 'expense'; });
  var revenue = sum(inc, amt), interest = sum(exp, function (e) { return e.interest || 0; });
  var cost = sum(exp, amt) + interest, profit = revenue - cost;
  var received = sum(inc.filter(function (e) { return e.status !== 'receivable'; }), amt);
  var distance = sum(scoped, function (e) { return e.distance || 0; });
  var rcvOut = sum(base.filter(function (e) { return e.kind === 'income' && e.status === 'receivable'; }), amt);
  var payOut = sum(base.filter(function (e) { return e.kind === 'expense' && e.status === 'loan'; }), function (e) { return e.amount + (e.interest || 0); });
  var incAgg = aggByType(inc), expAgg = aggByType(exp);
  if (interest > 0) expAgg.Interest = (expAgg.Interest || 0) + interest;
  var topInc = topKey(incAgg), topExp = topKey(expAgg);
  var h = '<div class="filters">' + truckSelect(dashTruck, 'dashTruck=this.value;render();') + '<div class="seg dark">' + seg(['week', 'month', 'all'], dashPeriod, 'setDashPeriod') + '</div></div>';
  h += '<div class="hero"><div class="hero-label">' + (profit >= 0 ? t('netProfit') : t('netLoss')) + '</div><div class="hero-net" style="color:' + (profit >= 0 ? '#3DD68C' : '#FF6B57') + '">' + (profit < 0 ? '−' : '') + money(Math.abs(profit)) + '</div>'
    + '<div class="hero-two"><div class="hero-cell"><span class="hero-k">' + t('revenue') + '</span><span class="hero-v" style="color:#3DD68C">' + money(revenue) + '</span></div><div class="hero-div"></div>'
    + '<div class="hero-cell"><span class="hero-k">' + t('totalCost') + '</span><span class="hero-v" style="color:#FF7A66">' + money(cost) + '</span></div></div></div>';
  h += '<div class="grid2">' + card(t('cashReceived'), money(received)) + card(t('perKm'), distance > 0 ? money(profit / distance) : '—', 'accent') + card(t('receivableOut'), money(rcvOut), 'accent') + card(t('payableOut'), money(payOut), 'neg') + '</div>';
  h += '<div class="grid2">' + card(t('topIncome'), topInc ? esc(catLabel(topInc)) : '—', 'pos', 1, topInc ? money(incAgg[topInc]) : '') + card(t('topCost'), topExp ? esc(catLabel(topExp)) : '—', 'neg', 1, topExp ? money(expAgg[topExp]) : '') + '</div>';
  return h + trendChart(base) + breakdown(t('breakdownCost'), expAgg, 'var(--out)') + breakdown(t('breakdownIncome'), incAgg, 'var(--in)');
}
function trendChart(base) {
  var now = new Date(), data = [];
  for (var i = 5; i >= 0; i--) {
    var d = new Date(now.getFullYear(), now.getMonth() - i, 1), y = d.getFullYear(), m = d.getMonth(), inc = 0, exp = 0;
    base.forEach(function (e) { var a = (e.date || '').split('-'); if (+a[0] === y && +a[1] - 1 === m) { if (e.kind === 'income') inc += e.amount; else exp += e.amount + (e.interest || 0); } });
    data.push({ label: MON[lang][m], inc: inc, exp: exp });
  }
  var max = Math.max(1, Math.max.apply(null, data.map(function (x) { return Math.max(x.inc, x.exp); })));
  return '<div class="chart"><div class="sec-title" style="margin:0 0 2px">' + t('trend') + '</div><div class="bars">' + data.map(function (x) {
    return '<div class="bgrp"><div class="bpair"><div class="bar i" style="height:' + Math.round(x.inc / max * 100) + '%"></div><div class="bar e" style="height:' + Math.round(x.exp / max * 100) + '%"></div></div><span class="blabel">' + x.label + '</span></div>';
  }).join('') + '</div><div class="legend"><span><span class="dot" style="background:var(--in)"></span>' + t('income') + '</span><span><span class="dot" style="background:var(--out)"></span>' + t('expense') + '</span></div></div>';
}
function breakdown(title, agg, color) {
  var keys = Object.keys(agg).sort(function (a, b) { return agg[b] - agg[a]; }).slice(0, 6);
  if (!keys.length) return '';
  var total = keys.reduce(function (s, k) { return s + agg[k]; }, 0) || 1;
  return '<div class="sec-title">' + title + '</div><div class="brk">' + keys.map(function (k) {
    return '<div class="brk-row"><span class="brk-name">' + esc(catLabel(k)) + '</span><div class="brk-bar-wrap"><div class="brk-bar" style="width:' + Math.round(agg[k] / total * 100) + '%;background:' + color + '"></div></div><span class="brk-val">' + money(agg[k]) + '</span></div>';
  }).join('') + '</div>';
}

// ---------- ADMIN: ledger ----------
function viewLedger() {
  var h = '<div class="actions"><button class="act in" onclick="openEntry(\'income\')">+ ' + t('addIncome') + '</button><button class="act out" onclick="openEntry(\'expense\')">+ ' + t('addCost') + '</button></div>';
  h += '<div class="filters">' + truckSelect(logTruck, 'logTruck=this.value;render();') + '<div class="seg">' + ['all', 'income', 'expense'].map(function (o) {
    return '<button class="seg-btn' + (logKind === o ? ' on' : '') + '" onclick="logKind=\'' + o + '\';render();">' + (o === 'all' ? t('all') : o === 'income' ? t('income') : t('expense')) + '</button>';
  }).join('') + '</div></div>';
  h += '<input class="input" style="margin-bottom:12px" placeholder="' + t('search') + '" value="' + esc(logSearch) + '" oninput="logSearch=this.value;renderRows();">';
  return h + '<div id="logRows">' + ledgerRows() + '</div>';
}
function renderRows() { var el = document.getElementById('logRows'); if (el) el.innerHTML = ledgerRows(); }
function ledgerRows() {
  var q = logSearch.trim().toLowerCase();
  var list = state.ledger.filter(function (e) {
    if (logTruck !== 'all' && e.truckId !== logTruck) return false;
    if (logKind !== 'all' && e.kind !== logKind) return false;
    return !q || (e.type + ' ' + catLabel(e.type) + ' ' + e.note + ' ' + e.party + ' ' + truckName(e.truckId) + ' ' + userName(e.enteredBy)).toLowerCase().indexOf(q) >= 0;
  }).sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : (b.createdAt || 0) - (a.createdAt || 0); });
  if (!list.length) return '<div class="empty">' + t('noEntries') + '</div>';
  return '<div class="list">' + list.map(function (e) {
    var badges = '';
    if (e.kind === 'income' && e.status === 'receivable') badges += '<span class="badge rcv">' + t('receivable') + '</span>';
    if (e.kind === 'expense' && e.status === 'loan') badges += '<span class="badge loan">' + t('loan') + '</span>';
    if (e.type === 'Purchase') badges += '<span class="badge buy">' + t('purchase') + '</span>';
    var by = e.enteredBy && e.enteredBy !== state.me.email ? '<span class="tag">👤 ' + esc(userName(e.enteredBy)) + '</span>' : '';
    return '<div class="row" onclick="openEntry(\'' + e.kind + '\',\'' + e.id + '\')"><div class="row-main"><div class="row-top"><span class="row-cat">' + esc(catLabel(e.type)) + '</span><span class="row-amt ' + e.kind + '">' + (e.kind === 'income' ? '+' : '−') + money(e.amount) + '</span></div>'
      + '<div class="row-sub"><span class="mono">' + fmtDate(e.date) + '</span><span class="tag">' + esc(truckName(e.truckId)) + '</span>' + by + badges
      + (e.party ? '<span>· ' + esc(e.party) + '</span>' : '') + (e.note ? '<span>· ' + esc(e.note) + '</span>' : '') + (e.interest > 0 ? '<span>· ' + t('interest') + ' ' + money(e.interest) + '</span>' : '')
      + (e.photo ? '<span>📷</span>' : '') + (isPending(e.id) ? '<span class="st wait">⏳</span>' : '') + '</div></div></div>';
  }).join('') + '</div>';
}

// ---------- ADMIN: trucks ----------
function viewTrucks() {
  var h = '<button class="btn amber" style="margin-bottom:14px" onclick="openTruck(\'\')">+ ' + t('addTruck') + '</button>';
  if (!state.trucks.length) return h + '<div class="empty">' + t('noTrucks') + '</div>';
  return h + state.trucks.map(function (tr) {
    var meta = [];
    if (tr.plate) meta.push(esc(tr.plate)); if (tr.model) meta.push(esc(tr.model)); if (tr.year) meta.push(esc(tr.year));
    meta.push(num(state.ledger.filter(function (e) { return e.truckId === tr.id; }).length) + ' ' + t('entries'));
    var drivers = state.users.filter(function (u) { return u.truckId === tr.id; }).map(function (u) { return esc(u.name); });
    if (drivers.length) meta.push('👤 ' + drivers.join(', '));
    return '<div class="tcard' + (tr.active ? '' : ' off') + '" onclick="openTruck(\'' + tr.id + '\')"><div class="tcard-top"><span class="tcard-name">' + esc(tr.name) + '</span>' + (tr.active ? '' : '<span class="tag">' + t('inactive') + '</span>') + '</div><div class="tcard-meta">' + meta.join(' · ') + '</div></div>';
  }).join('');
}

// ---------- ADMIN: dues ----------
function viewDues() {
  var byDue = function (a, b) { return (a.dueDate || a.date) > (b.dueDate || b.date) ? 1 : -1; };
  var rcv = state.ledger.filter(function (e) { return e.kind === 'income' && e.status === 'receivable'; }).sort(byDue);
  var loans = state.ledger.filter(function (e) { return e.kind === 'expense' && e.status === 'loan'; }).sort(byDue);
  var h = '<div class="grid2">' + card(t('receivables'), money(sum(rcv, amt)), 'pos') + card(t('loans'), money(sum(loans, function (e) { return e.amount + (e.interest || 0); })), 'neg') + '</div>';
  var item = function (e, isLoan) {
    var meta = [fmtDate(e.date), truckName(e.truckId), catLabel(e.type)]; if (e.dueDate) meta.push(t('dueDate') + ': ' + fmtDate(e.dueDate));
    var total = e.amount + (isLoan ? (e.interest || 0) : 0);
    return '<div class="due"><div class="due-top"><span class="due-party">' + esc(e.party || catLabel(e.type)) + '</span><span class="due-amt ' + (isLoan ? 'neg' : 'pos') + '">' + money(total) + '</span></div>'
      + '<div class="due-meta">' + meta.map(esc).join(' · ') + '</div>' + (isLoan && e.interest > 0 ? '<div class="due-meta">' + t('amount') + ' ' + money(e.amount) + ' + ' + t('interest') + ' ' + money(e.interest) + '</div>' : '')
      + '<button class="due-btn ' + (isLoan ? 'pay' : 'rcv') + '" onclick="markStatus(\'' + e.id + '\',\'' + (isLoan ? 'paid' : 'received') + '\')">' + (isLoan ? t('markPaid') : t('markReceived')) + '</button></div>';
  };
  h += '<div class="sec-title">' + t('receivables') + '</div>' + (rcv.length ? rcv.map(function (e) { return item(e, false); }).join('') : '<div class="empty">' + t('noReceivables') + '</div>');
  h += '<div class="sec-title" style="margin-top:16px">' + t('loans') + '</div>' + (loans.length ? loans.map(function (e) { return item(e, true); }).join('') : '<div class="empty">' + t('noLoans') + '</div>');
  return h;
}
function markStatus(id, st) {
  var e = findEntry(id); if (!e) return;
  e.status = st;
  enqueue({ op: 'save', entry: JSON.parse(JSON.stringify(e)) });
  render(); toast(t('saved'));
}

// ---------- ADMIN: settings ----------
function viewSettings() {
  var h = '<div class="sec-title">' + t('language') + '</div><div class="segfull" style="margin:0 0 16px">' + tbtn(lang === 'en', 'English', "setLang('en')") + tbtn(lang === 'bn', 'বাংলা', "setLang('bn')") + '</div>';
  h += '<div class="sec-title">' + t('currency') + '</div><select class="input" style="margin-bottom:18px" onchange="setCurrency(this.value)">' + CUR.map(function (c) { return '<option value="' + c[0] + '"' + (state.settings.currency === c[0] ? ' selected' : '') + '>' + c[0] + ' (' + c[1] + ')</option>'; }).join('') + '</select>';
  h += '<div class="sec-title">' + t('people') + '</div>' + peopleList() + '<button class="btnsm" style="margin:10px 0 20px" onclick="openUser(-1)">+ ' + t('addPerson') + '</button>';
  h += '<div class="sec-title">' + t('incomeTypes') + '</div><p class="hint">' + t('showDrivers') + '</p>' + typeManager('income');
  h += '<div class="sec-title" style="margin-top:18px">' + t('expenseTypes') + '</div>' + typeManager('expense');
  h += '<button class="btn ghost" style="margin-top:26px" onclick="logout()">' + t('logout') + ' (' + esc(state.me.email) + ')</button>';
  return h;
}
function peopleList() {
  if (!state.users.length) return '';
  return '<div class="list">' + state.users.map(function (u, i) {
    return '<div class="row' + (u.active ? '' : ' off') + '" onclick="openUser(' + i + ')"><div class="row-main"><div class="row-top"><span class="row-cat">' + esc(u.name) + '</span><span class="tag">' + (u.role === 'admin' ? t('admin') : t('driver')) + '</span></div>'
      + '<div class="row-sub"><span>' + esc(u.email) + '</span>' + (u.role === 'driver' ? '<span>· ' + esc(u.truckId ? truckName(u.truckId) : t('noTruckAssigned')) + '</span>' : '') + '</div></div></div>';
  }).join('') + '</div>';
}
function typeManager(kind) {
  return '<div class="chips">' + typesFor(kind).map(function (ty) {
    return '<span class="tchip' + (ty.driver ? '' : ' hid') + '"><span onclick="toggleTypeDriver(\'' + ty.id + '\')">' + (ty.driver ? '👁 ' : '🚫 ') + esc(catLabel(ty.name)) + '</span><button onclick="delType(\'' + ty.id + '\')" aria-label="' + t('del') + '">✕</button></span>';
  }).join('') + '</div><div class="addrow"><input class="input" id="newtype_' + kind + '" placeholder="' + t('typeName') + '"><button class="btnsm" onclick="addType(\'' + kind + '\')">' + t('add') + '</button></div>';
}
function setCurrency(c) { state.settings.currency = c; render(); adminCall('saveSettings', { currency: c }); }
function addType(kind) { var name = val('newtype_' + kind).trim(); if (!name) return; var ty = { id: uid(), kind: kind, name: name, driver: true }; state.types.push(ty); render(); adminCall('saveType', ty); }
function delType(id) { showConfirm(t('del') + '?', function () { state.types = state.types.filter(function (x) { return x.id !== id; }); closeModal(); render(); adminCall('deleteType', { id: id }); }); }
function toggleTypeDriver(id) { var ty = findType(id); if (!ty) return; ty.driver = !ty.driver; render(); adminCall('saveType', ty); }

// ---------- ADMIN: entry form ----------
function openEntry(kind, id) {
  var e = id ? findEntry(id) : null;
  var trucks = state.trucks.filter(function (x) { return x.active || (e && x.id === e.truckId); });
  if (!trucks.length && !e) { toast(t('addTruckFirst')); return go('trucks'); }
  formKind = e ? e.kind : kind; editingId = id || '';
  formStatus = e ? e.status : (formKind === 'income' ? 'received' : 'paid');
  var truckSel = e ? e.truckId : trucks[0].id;
  var names = typesFor(formKind).map(function (x) { return x.name; });
  if (e && names.indexOf(e.type) < 0) names.unshift(e.type);   // keep a type that was deleted later
  if (!names.length) names = ['Other'];
  var typeSel = e ? e.type : names[0];
  var truckOpts = trucks.map(function (tr) { return '<option value="' + tr.id + '"' + (truckSel === tr.id ? ' selected' : '') + '>' + esc(tr.name) + '</option>'; }).join('');
  if (e && !findTruck(e.truckId)) truckOpts = '<option value="' + esc(e.truckId) + '" selected>—</option>' + truckOpts;
  var inc = formKind === 'income';
  var h = '<div class="sheet-head"><h3>' + (e ? t('editEntry') : inc ? t('addIncome') : t('addCost')) + '</h3><button class="iconbtn" onclick="closeModal()">✕</button></div>';
  h += '<label class="label">' + t('amount') + '</label><div class="amtwrap"><span class="amtsym">' + sym() + '</span><input class="amtin" id="f_amount" type="number" inputmode="decimal" placeholder="0" value="' + (e ? e.amount : '') + '"></div>';
  h += '<label class="label">' + t('truck') + '</label><select class="input" id="f_truck">' + truckOpts + '</select>';
  h += '<label class="label">' + t('type') + '</label><select class="input" id="f_type">' + names.map(function (n) { return '<option value="' + esc(n) + '"' + (typeSel === n ? ' selected' : '') + '>' + esc(catLabel(n)) + '</option>'; }).join('') + '</select>';
  h += '<div class="two"><div><label class="label">' + t('date') + '</label><input class="input" id="f_date" type="date" value="' + (e && e.date ? e.date : todayStr()) + '"></div><div><label class="label">' + t('distanceKm') + '</label><input class="input" id="f_distance" type="number" inputmode="decimal" placeholder="0" value="' + (e && e.distance ? e.distance : '') + '"></div></div>';
  h += '<label class="label">' + t('note') + ' (' + t('optional') + ')</label><input class="input" id="f_note" value="' + (e ? esc(e.note) : '') + '">';
  var bakiOn = formStatus === 'receivable' || formStatus === 'loan';
  h += '<label class="label">' + t('status') + '</label><div class="segfull" style="margin-top:0"><button id="st_a" class="' + (bakiOn ? '' : 'on') + '" onclick="setStatus(\'' + (inc ? 'received' : 'paid') + '\')">' + (inc ? t('received') : t('paidByMe')) + '</button><button id="st_b" class="' + (bakiOn ? 'on' : '') + '" onclick="setStatus(\'' + (inc ? 'receivable' : 'loan') + '\')">' + (inc ? t('receivable') : t('paidOther')) + '</button></div>';
  h += '<div class="cond' + (bakiOn ? ' show' : '') + '" id="condBlock"><label class="label">' + (inc ? t('whoOwes') : t('whoPaid')) + '</label><input class="input" id="f_party" value="' + (e ? esc(e.party) : '') + '">'
    + '<div class="two">' + (inc ? '' : '<div><label class="label">' + t('interest') + '</label><input class="input" id="f_interest" type="number" inputmode="decimal" placeholder="0" value="' + (e && e.interest ? e.interest : '') + '"></div>')
    + '<div><label class="label">' + t('dueDate') + '</label><input class="input" id="f_due" type="date" value="' + (e && e.dueDate ? e.dueDate : '') + '"></div></div></div>';
  if (e && e.enteredBy) h += '<p class="hint" style="margin-top:14px">' + t('enteredBy') + ': ' + esc(userName(e.enteredBy)) + '</p>';
  if (e && e.photo && e.photo !== 'pending') h += '<a class="btn ghost" style="margin-top:10px" target="_blank" rel="noopener" href="https://drive.google.com/file/d/' + encodeURIComponent(e.photo) + '/view">📷 ' + t('viewPhoto') + '</a>';
  h += '<button class="btn ' + (inc ? 'in' : 'out') + '" style="margin-top:18px" onclick="saveEntryForm()">' + t('save') + '</button>';
  if (e) h += '<button class="btn danger" style="margin-top:10px" onclick="deleteEntryConfirm(\'' + e.id + '\')">' + t('del') + '</button>';
  openModal(h);
}
function setStatus(v) {
  formStatus = v;
  var on = v === 'receivable' || v === 'loan';
  document.getElementById('condBlock').classList.toggle('show', on);
  document.getElementById('st_a').classList.toggle('on', !on);
  document.getElementById('st_b').classList.toggle('on', on);
}
function saveEntryForm() {
  var amount = parseFloat(val('f_amount'));
  if (!amount || amount <= 0) return toast(t('amount') + ' > 0');
  var old = editingId ? findEntry(editingId) : null;
  var e = { id: editingId || uid(), truckId: val('f_truck'), kind: formKind, type: val('f_type'), amount: Math.round(amount * 100) / 100,
    date: val('f_date') || todayStr(), note: val('f_note').trim(), status: formStatus, party: '', dueDate: '', interest: 0,
    distance: parseFloat(val('f_distance')) || 0, createdAt: old ? old.createdAt : Date.now(), enteredBy: old ? old.enteredBy : state.me.email, photo: old ? old.photo : '' };
  if (formStatus === 'receivable' || formStatus === 'loan') { e.party = val('f_party').trim(); e.dueDate = val('f_due'); }
  if (formStatus === 'loan') e.interest = parseFloat(val('f_interest')) || 0;
  if (!enqueue({ op: 'save', entry: e })) return;
  var i = findIdx(e.id); if (i >= 0) state.ledger[i] = lite(e); else state.ledger.unshift(lite(e));
  closeModal(); render(); toast(t('saved'));
}
function deleteEntryConfirm(id) {
  showConfirm(t('deleteEntry'), function () {
    state.ledger = state.ledger.filter(function (x) { return x.id !== id; });
    enqueue({ op: 'delete', id: id }); closeModal(); render(); toast(t('del'));
  });
}

// ---------- ADMIN: truck + person forms ----------
function openTruck(id) {
  var tr = id ? findTruck(id) : null;
  var h = '<div class="sheet-head"><h3>' + (tr ? t('editTruck') : t('addTruck')) + '</h3><button class="iconbtn" onclick="closeModal()">✕</button></div>';
  h += '<label class="label">' + t('truckName') + '</label><input class="input" id="tk_name" value="' + (tr ? esc(tr.name) : '') + '" placeholder="Truck 1">';
  h += '<label class="label">' + t('plate') + '</label><input class="input" id="tk_plate" value="' + (tr ? esc(tr.plate) : '') + '">';
  h += '<div class="two"><div><label class="label">' + t('model') + '</label><input class="input" id="tk_model" value="' + (tr ? esc(tr.model) : '') + '"></div><div><label class="label">' + t('year') + '</label><input class="input" id="tk_year" type="number" value="' + (tr ? esc(tr.year) : '') + '"></div></div>';
  h += '<label class="label">' + t('note') + '</label><input class="input" id="tk_note" value="' + (tr ? esc(tr.note) : '') + '">';
  h += '<label class="check" style="margin-top:14px"><input type="checkbox" id="tk_active"' + (!tr || tr.active ? ' checked' : '') + '> ' + t('active') + '</label>';
  h += '<button class="btn amber" style="margin-top:16px" onclick="saveTruckForm(\'' + (id || '') + '\')">' + t('save') + '</button>';
  if (tr) h += '<button class="btn danger" style="margin-top:10px" onclick="deleteTruckConfirm(\'' + id + '\')">' + t('del') + '</button>';
  openModal(h);
}
function saveTruckForm(id) {
  var name = val('tk_name').trim(); if (!name) return toast(t('truckName') + '?');
  var tk = { id: id || uid(), name: name, plate: val('tk_plate').trim(), model: val('tk_model').trim(), year: val('tk_year').trim(), note: val('tk_note').trim(), active: document.getElementById('tk_active').checked };
  var i = state.trucks.findIndex(function (x) { return x.id === tk.id; });
  if (i >= 0) state.trucks[i] = tk; else state.trucks.push(tk);
  closeModal(); render(); toast(t('saved')); adminCall('saveTruck', tk);
}
function deleteTruckConfirm(id) { showConfirm(t('deleteTruckQ'), function () { state.trucks = state.trucks.filter(function (x) { return x.id !== id; }); closeModal(); render(); toast(t('del')); adminCall('deleteTruck', { id: id }); }); }
function openUser(i) {
  var u = i >= 0 ? state.users[i] : null, role = u ? u.role : 'driver', tr = u ? u.truckId : (state.trucks[0] ? state.trucks[0].id : '');
  var h = '<div class="sheet-head"><h3>' + (u ? t('editPerson') : t('addPerson')) + '</h3><button class="iconbtn" onclick="closeModal()">✕</button></div>';
  h += '<label class="label">' + t('email') + '</label><input class="input" id="u_email" type="email" autocapitalize="none" placeholder="name@gmail.com" value="' + (u ? esc(u.email) : '') + '"' + (u ? ' readonly' : '') + '>';
  h += '<label class="label">' + t('name') + '</label><input class="input" id="u_name" value="' + (u ? esc(u.name) : '') + '">';
  h += '<div class="two"><div><label class="label">' + t('role') + '</label><select class="input" id="u_role"><option value="driver"' + (role === 'driver' ? ' selected' : '') + '>' + t('driver') + '</option><option value="admin"' + (role === 'admin' ? ' selected' : '') + '>' + t('admin') + '</option></select></div>'
    + '<div><label class="label">' + t('truck') + '</label><select class="input" id="u_truck"><option value="">' + t('none') + '</option>' + state.trucks.map(function (x) { return '<option value="' + x.id + '"' + (tr === x.id ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('') + '</select></div></div>';
  h += '<label class="check" style="margin-top:14px"><input type="checkbox" id="u_active"' + (!u || u.active ? ' checked' : '') + '> ' + t('active') + '</label>';
  h += '<button class="btn amber" style="margin-top:16px" onclick="saveUserForm()">' + t('save') + '</button>';
  if (u && u.email !== state.me.email) h += '<button class="btn danger" style="margin-top:10px" onclick="deleteUserConfirm(' + i + ')">' + t('del') + '</button>';
  openModal(h);
}
function saveUserForm() {
  var u = { email: val('u_email').trim().toLowerCase(), name: val('u_name').trim(), role: val('u_role'), truckId: val('u_truck'), active: document.getElementById('u_active').checked };
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(u.email)) return toast(t('email') + '?');
  if (u.email === state.me.email && (u.role !== 'admin' || !u.active)) return toast(t('notSaved'));
  if (!u.name) u.name = u.email.split('@')[0];
  var i = state.users.findIndex(function (x) { return x.email === u.email; });
  if (i >= 0) state.users[i] = u; else state.users.push(u);
  closeModal(); render(); toast(t('saved')); adminCall('saveUser', u);
}
function deleteUserConfirm(i) { var u = state.users[i]; if (!u) return; showConfirm(t('del') + ': ' + u.name + '?', function () { state.users.splice(i, 1); closeModal(); render(); adminCall('deleteUser', { email: u.email }); }); }

// ---------- modal plumbing ----------
function showConfirm(msg, onYes, yesLabel) {
  window.__yes = onYes;
  openModal('<div class="sheet-head"><h3>' + esc(msg) + '</h3></div><button class="btn danger" onclick="__yes()">' + (yesLabel || t('del')) + '</button><button class="btn ghost" style="margin-top:10px" onclick="closeModal()">' + t('cancel') + '</button>');
}
function openModal(html) { document.getElementById('modalBody').innerHTML = html; document.getElementById('overlay').classList.add('show'); }
function closeModal(ev) { if (ev && ev.target && ev.target.id !== 'overlay') return; document.getElementById('overlay').classList.remove('show'); }

// ================= 8. Go =================
if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
window.addEventListener('online', flush);
document.addEventListener('visibilitychange', function () { if (!document.hidden && token) { flush(); refresh(true); } });
setInterval(flush, 30000);
start();
</script>
</body>
</html>
